<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1A2A3A"/>
  <circle cx="50" cy="50" r="48" stroke="#3CB878" stroke-width="2" fill="none"/>

  <!-- Turbine blades (3 curved paths) -->
  <!-- Blade 1 -->
  <path d="M50 50 L50 12 Q50 4 44 8 Q38 12 40 20" fill="#7EC8E3" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Blade 2 (rotated 120°) -->
  <path d="M50 50 L82.9 69 Q88 72 84.8 78 Q81.6 84 74 79.3" fill="#7EC8E3" stroke="#FFFFFF" stroke-width="1"/>
  <!-- Blade 3 (rotated 240°) -->
  <path d="M50 50 L17.1 69 Q12 72 15.2 78 Q18.4 84 26 79.3" fill="#7EC8E3" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Center hub -->
  <circle cx="50" cy="50" r="6" fill="#0A4C6B" stroke="#7EC8E3" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="2.5" fill="#3CB878"/>
</svg>
